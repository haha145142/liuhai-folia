name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

env:
  VITE_NETEASE_API_BASE: https://netease-cloud-music-api-v2-chi.vercel.app
  VITE_KUGOU_API_BASE: https://ku-gou-music-api-rho-eight.vercel.app
  VITE_QQ_API_BASE: https://qq-music-api-iota-three.vercel.app

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets to iOS
        run: npx cap sync ios

      - name: Enable background audio
        run: |
 plutil -replace UIBackgroundModes -json '["audio"]' ios/App/App/Info.plist

      - name: Build unsigned IPA
        run: |
 mkdir -p build
 cat > build/exportOptions.plist <<'EOF'
 <?xml version="1.0" encoding="UTF-8"?>
 <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
 <plist version="1.0">
 <dict>
   <key>signingStyle</key>
   <string>Manual</string>
   <key>method</key>
   <string>Release</string>
   <key>stripSwiftSymbols</key>
   <true/>
 </dict>
 </plist>
 EOF
 xcodebuild -workspace ios/App/App.xcworkspace \
   -scheme App \
   -configuration Release \
   -archivePath build/App.xcarchive \
   CODE_SIGN_IDENTITY="" \
   CODE_SIGNING_REQUIRED=NO \
   CODE_SIGNING_ALLOWED=NO \
   archive
 xcodebuild -exportArchive \
   -archivePath build/App.xcarchive \
   -exportOptionsPlist build/exportOptions.plist \
   -exportPath build/ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Folia-ios-unsigned
          path: build/ipa/*.ipa
